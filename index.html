<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A2641">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TourPilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Neubau TourPilot | OKS</title>
  <link rel="manifest" href="manifest.json?v=20260629-pwa">
  <link rel="apple-touch-icon" href="assets/tourpilot-icon.svg?v=20260629-pwa">
  <link rel="icon" href="assets/tourpilot-icon.svg?v=20260629-pwa" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260629-pwa">
  <link rel="stylesheet" href="tourpilot-fixes.css?v=20260629-pwa">
  <link rel="stylesheet" href="tourpilot-v2-3.css?v=20260629-pwa">
  <link rel="stylesheet" href="tourpilot-v2-5.css?v=20260629-pwa">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brandmark" aria-label="Ostschweizer Kinderspital">
        <img class="brandLogo" src="assets/oks-logo.svg?v=20260629-pwa" alt="Ostschweizer Kinderspital">
      </div>
      <button id="menu" class="menu" aria-label="Info">☰</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="nav">
      <button data-view="start" class="active">⌂<small>Start</small></button>
      <button data-view="tour">⌖<small>Tour</small></button>
      <button data-view="questions">?<small>Fragen</small></button>
      <button data-view="finish">✓<small>Abschluss</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2-fixes.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2-2-fixes.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2-3-fixes.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2-5.js?v=20260629-pwa"></script>
  <script src="tourpilot-v2-6-startscreen.js?v=20260629-startonly"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js?v=20260629-pwa').catch(() => {}));
    }
  </script>
</body>
</html>
